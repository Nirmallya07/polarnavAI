version: '3.9'

services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: bash -lc "pip install -r requirements.txt && flask --app backend.app run --host 0.0.0.0 --port 5000"
    environment:
      FLASK_ENV: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      FRONTEND_PORT: 5173
    ports:
      - "5173:5173"
